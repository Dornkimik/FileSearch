[package]
name = "file_search"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
crossbeam-channel = "0.5.17"
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "links"] }
egui_extras = "0.37"
memchr = "2.8.3"
open = "5.4.5"
parking_lot = "0.13.0"
rayon = "1.12.0"
regex = "1.13.1"
rfd = "0.17"
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
